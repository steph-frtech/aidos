version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries.sql"
    schema: "../../migrations/archive_baseline.sql"
    gen:
      go:
        package: "archivegen"
        out: "../../gen/archive"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
